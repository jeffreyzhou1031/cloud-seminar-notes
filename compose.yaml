# Cloud Deployments Seminar: 3-Service Application
# Run locally: docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: notes
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notes"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      APP_MESSAGE: "Hello from Spring Boot API"
      APP_VERSION: "v1.0"
      DB_URL: "postgres://notes_user:dev_password@db:5432/notes"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  dbdata:
